<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>California Wildfire Risk Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; }
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://demotiles.maplibre.org/style.json',  // free basemap, no API key
      center: [-119.4, 36.5],   // California
      zoom: 5
    });
  </script>
</body>
</html>
